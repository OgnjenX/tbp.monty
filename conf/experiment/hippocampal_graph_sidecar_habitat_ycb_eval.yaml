defaults:
  - config/eval
  - config/logging/clear_logging@config
  - config/logging/parallel_evidence_lm@config.logging
  - config/monty/clear_monty_config@config
  - config/monty/patch_and_view@config.monty_config
  - config/monty/args/clear_monty_args@config.monty_config
  - config/monty/args/defaults@config.monty_config.monty_args
  - config/monty/learning_modules/clear_learning_module_configs@config.monty_config
  - config/monty/learning_modules/default_evidence_1lm@config.monty_config.learning_module_configs
  - config/monty/motor_system/clear_motor_system_config@config.monty_config.motor_system_config
  - config/monty/motor_system/informed_no_trans_step_s20@config.monty_config.motor_system_config
  - config/environment/clear_env_interface_config@config
  - config/environment/patch_view_finder_mount_habitat@config.env_interface_config
  - config/environment/init_args/defaults@config.env_interface_config.env_init_args
  - config/environment_interface/per_object_eval@config.eval_env_interface_args
  - _self_

_target_: tbp.monty.frameworks.experiments.hippocampal_graph_sidecar_experiment.MontyObjectRecognitionHippocampalGraphSidecarExperiment
config:
  do_eval: true
  do_train: false
  n_eval_epochs: 1
  max_eval_steps: 200
  # Load an existing pretrained model so LMs produce confident outputs that the
  # hippocampal sidecar can observe.
  model_name_or_path: ${benchmarks.pretrained_dir}/surf_agent_1lm_10distinctobj/pretrained/
  logging:
    run_name: hippocampal_graph_sidecar_habitat_ycb_eval
  # Point at your local habitat data root. This should contain `versioned_data/ycb_1.2`.
  env_interface_config:
    env_init_args:
      data_path: /Users/ognjencadovski/tbp/data/habitat
  eval_env_interface_args:
    object_names:
      - 025_mug
      - 031_spoon
      - 029_plate
    object_init_sampler:
      _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
      rotations:
        - [0.0, 0.0, 0.0]
  eval_env_interface_class: ${monty.class:tbp.monty.frameworks.environments.embodied_data.InformedEnvironmentInterface}
  hippocampal_graph:
    enabled: true
    learning_rate: 0.8
    decay_rate: 0.0
    enable_replay: true
    max_episode_history: 200
    context_from_primary_target: true
    dedupe_consecutive_object_ids: true
    output_confidence_threshold: 0.0
    write_csv: true
